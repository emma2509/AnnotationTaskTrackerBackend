name: Annotation Task Tracker Backend Pipeline
run-name: Annotation Task Tracker Backend Pipeline
on: [push]
env:
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  TEST_ACCOUNT_USERNAME: ${{ secrets.TEST_ACCOUNT_USERNAME }}
  TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
jobs:
  UnitTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.x'
      - name: Run pybuilder which includes running unit tests
        run: |
          python -m pip install pybuilder
          pyb

  SecurityTest:
    runs-on: ubuntu-latest
    needs: UnitTest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.x'
      - name: Run pybuilder
        run: |
          python -m pip install pybuilder
          pyb
      - name: Run security tests
        run: |
          pytest test/security

  Deploy:
    runs-on: ubuntu-latest
    needs: SecurityTest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
